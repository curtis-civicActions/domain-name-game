{% extends "base.html" %}

{% block head %}
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}

{% set page_title = "Gather Data" %}

{% block content %}
    <p class="text-gray-700 leading-relaxed mt-4">Fun game where you can either match the owner to a domain or vice versa.</p>
<div>
  <div style="margin-bottom: 10px">
      <button style="margin: 20px; border: 3px solid blue; height: 50px; width: 40%">
          <a href="/load/data">Fill Out Data Form</a>
      </button>
  </div>
  <div style="margin-bottom: 10px">
      <button id="load-btn" onclick="fetchSpreadsheetData()" style="margin: 20px;  border: 3px solid red; height: 50px; width: 40%; cursor: pointer">
          Load Spreadsheet Data
      </button>
  </div>
  <!-- The Loading Bar Element -->
  <div id="loading-container">
      <div id="loading-bar"></div>
  </div>

  <!-- Container where AJAX data will be displayed -->
    <div id="data-display-area" style="margin: 20px;"></div>
</div>
{% endblock %}
