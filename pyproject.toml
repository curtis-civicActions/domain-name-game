[project]
name = "flask-basics"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-wtf>=1.3.0",
    "flask-mongoengine-3>=0.1.3",
    "python-dotenv>=1.2.3",
    "python-slugify>=9.0.0",
    "faker>=30.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
    "gspread>=6.0.0",
    "mongomock>=4.3.0",
    "WTForms>=3.1.0",
    "Flask-WTF>=1.2.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.18.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "debugpy>=1.8.0",
    "mongomock>=4.1.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
